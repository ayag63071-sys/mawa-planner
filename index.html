
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaWa Planner | Aya Gaber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=El+Messiri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #c49a7c;
            --accent-blue: #7eb8c9;
            --accent-gold: #d4a853;
            --accent-rose: #e8c4b8;
        }

        * { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; }
        
        body {
            margin: 0;
            overflow-x: hidden;
            background: #faf7f2;
            transition: all 0.6s ease;
        }

        body.dark-mode {
            background: #0f0d0a;
        }

        /* خلفية منقوشة */
        .pattern-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(196,154,124,0.12) 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, rgba(126,184,201,0.12) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(212,168,83,0.08) 1px, transparent 1px);
            background-size: 40px 40px, 50px 50px, 60px 60px;
            animation: patternMove 20s linear infinite;
        }

        body.dark-mode .pattern-bg {
            opacity: 0.3;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(212,168,83,0.15) 1px, transparent 1px),
                radial-gradient(circle at 75% 75%, rgba(240,215,140,0.12) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(196,154,124,0.1) 1px, transparent 1px);
        }

        @keyframes patternMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 40px 40px, -50px 50px, 60px -60px; }
        }

        /* فقاعات */
        .bubbles-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(200,180,210,0.2));
            animation: floatBubble 12s infinite ease-in-out;
            box-shadow: 0 8px 30px rgba(180,160,200,0.2);
        }

        body.dark-mode .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(212,168,83,0.3), rgba(30,40,60,0.1));
            box-shadow: 0 8px 30px rgba(212,168,83,0.15);
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.4; }
            25% { transform: translateY(-40px) translateX(25px) scale(1.15); opacity: 0.7; }
            50% { transform: translateY(-20px) translateX(-20px) scale(0.9); opacity: 0.5; }
            75% { transform: translateY(-50px) translateX(15px) scale(1.1); opacity: 0.65; }
        }

        /* نجوم */
        .stars-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.dark-mode .stars-layer { opacity: 1; }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2.5s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.7); box-shadow: 0 0 4px 1px rgba(255,255,255,0.3); }
            100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 12px 3px rgba(255,255,255,0.8); }
        }

        /* شاشة ترحيبية */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            animation: fadeOut 1s ease forwards;
            animation-delay: 6s;
            pointer-events: all;
        }

        @keyframes fadeOut {
            to { opacity: 0; pointer-events: none; }
        }

        .welcome-text {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f0d78c, #d4a853, #f0c8b0, #ffffff, #d4a853);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: welcomeShimmer 2s ease-in-out infinite, welcomeScale 1.5s ease forwards;
            text-align: center;
            filter: drop-shadow(0 0 40px rgba(212,168,83,0.8));
        }

        @keyframes welcomeShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes welcomeScale {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* زجاج */
        .glass-card {
            background: rgba(255, 252, 248, 0.5);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 28px;
            box-shadow: 0 15px 45px rgba(160, 130, 100, 0.1), 0 0 0 1px rgba(255,255,255,0.2) inset;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode .glass-card {
            background: rgba(20, 16, 12, 0.6);
            backdrop-filter: blur(22px);
            border: 1px solid rgba(212, 168, 83, 0.2);
            box-shadow: 0 15px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,168,83,0.08) inset;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(160, 130, 100, 0.2);
        }

        body.dark-mode .glass-card:hover {
            box-shadow: 0 25px 60px rgba(212, 168, 83, 0.2);
        }

        /* أيقونات زجاجية */
        .glass-icon {
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 8px 20px rgba(160,130,100,0.15);
        }

        .glass-icon:hover {
            transform: translateY(-8px) rotate(-5deg) scale(1.12);
            box-shadow: 0 20px 40px rgba(160,130,100,0.3);
            background: rgba(255,255,255,0.7);
        }

        body.dark-mode .glass-icon {
            background: rgba(30,25,20,0.5);
            border: 1px solid rgba(212,168,83,0.3);
        }

        body.dark-mode .glass-icon:hover {
            background: rgba(40,35,28,0.7);
            box-shadow: 0 20px 40px rgba(212,168,83,0.3);
        }

        /* أيقونة البراند */
        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: linear-gradient(135deg, #f0d78c, #c49a7c, #7eb8c9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            animation: logoFloat 4s ease-in-out infinite;
            box-shadow: 0 8px 30px rgba(196,154,124,0.4);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(3deg); }
            75% { transform: translateY(-4px) rotate(-3deg); }
        }

        .brand-name {
            font-family: 'El Messiri', serif;
            font-size: 2.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c49a7c, #d4a853, #f0d78c, #c49a7c, #7eb8c9);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            filter: drop-shadow(0 0 20px rgba(196, 154, 124, 0.5));
        }

        body.dark-mode .brand-name {
            background: linear-gradient(135deg, #d4a853, #f0d78c, #ffd700, #d4a853, #c49a7c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.8));
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .btn-glow {
            background: linear-gradient(135deg, #c49a7c, #b08975);
            color: white;
            padding: 14px 30px;
            border-radius: 20px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(180, 130, 100, 0.35);
        }

        .btn-glow:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(180, 130, 100, 0.5);
        }

        body.dark-mode .btn-glow {
            background: linear-gradient(135deg, #d4a853, #b8943e);
            box-shadow: 0 10px 30px rgba(212, 168, 83, 0.4);
        }

        /* خط ذهبي لامع */
        .golden-text {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #d4a853, #f0d78c, #ffd700, #f0d78c, #d4a853);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
            font-weight: 600;
        }

        /* أيقونة شات بوت البراند */
        .chat-brand-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 999;
            width: 62px;
            height: 62px;
            border-radius: 20px;
            background: linear-gradient(135deg, #c49a7c, #7eb8c9, #d4a853);
            border: none;
            cursor: pointer;
            font-size: 26px;
            color: white;
            animation: chatPulse 3s infinite;
            box-shadow: 0 12px 35px rgba(196,154,124,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes chatPulse {
            0%, 100% { box-shadow: 0 12px 35px rgba(196,154,124,0.5); }
            50% { box-shadow: 0 12px 60px rgba(196,154,124,0.8), 0 0 80px rgba(212,168,83,0.4); }
        }

        /* أيقونات التواصل المتحركة */
        .social-icon-animated {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            background: rgba(255,255,255,0.35);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            color: inherit;
            text-decoration: none;
        }

        .social-icon-animated:hover {
            transform: translateY(-10px) rotate(8deg) scale(1.2);
            background: rgba(255,255,255,0.7);
            box-shadow: 0 20px 40px rgba(160,130,100,0.35);
        }

        body.dark-mode .social-icon-animated {
            background: rgba(30,25,20,0.5);
            border: 1px solid rgba(212,168,83,0.3);
        }

        body.dark-mode .social-icon-animated:hover {
            background: rgba(50,40,30,0.7);
            box-shadow: 0 20px 40px rgba(212,168,83,0.35);
        }

        input, select, textarea {
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid rgba(180,160,140,0.3);
            background: rgba(255,255,255,0.7);
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #c49a7c;
            box-shadow: 0 0 0 4px rgba(196,154,124,0.15);
        }

        body.dark-mode input, body.dark-mode select, body.dark-mode textarea {
            background: rgba(30,25,20,0.7);
            border-color: rgba(180,150,120,0.3);
            color: #f0e7dc;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(220,210,200,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #c49a7c, #7eb8c9); border-radius: 10px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-up { animation: fadeInUp 0.6s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ========== شاشة ترحيبية ==========
        const WelcomeScreen = ({ onDone }) => {
            const [visible, setVisible] = useState(true);
            useEffect(() => {
                const timer = setTimeout(() => {
                    setVisible(false);
                    if (onDone) onDone();
                }, 7000);
                return () => clearTimeout(timer);
            }, []);
            if (!visible) return null;
            return (
                <div className="welcome-screen">
                    <h1 className="welcome-text">
                        Welcome to MaWa<br />
                        <span style={{fontSize: '1.5rem'}}>Your Journey Starts Here ✨</span>
                    </h1>
                </div>
            );
        };

        // ========== أيقونة شات بوت ==========
        const ChatBot = ({ lang }) => {
            const [open, setOpen] = useState(false);
            const [msgs, setMsgs] = useState([
                { from: 'bot', text: lang === 'ar' ? '👋 أهلًا! أنا مساعد MaWa. اسألني أي حاجة!' : "👋 Hi! I'm MaWa assistant. Ask me anything!" }
            ]);
            const [input, setInput] = useState('');
            const ref = useRef(null);

            useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [msgs]);

            const reply = (msg) => {
                const m = msg.toLowerCase();
                if (m.includes('سعر') || m.includes('price')) return lang === 'ar' ? '💸 الأسعار تبدأ من 50 ج. تقدر تشوف التفاصيل في قسم البلانرز!' : '💸 Prices start from 50 EGP. Check planners section!';
                if (m.includes('بلانر') || m.includes('planner')) return lang === 'ar' ? '📋 عندنا +30 بلانر لكل حاجة في حياتك!' : '📋 We have +30 planners for everything!';
                if (m.includes('نوت') || m.includes('notebook')) return lang === 'ar' ? '📓 عندنا 9 أنواع نوت بوك مختلفة!' : '📓 We have 9 different notebook types!';
                const replies = lang === 'ar' ? 
                    ['🌟 فكرة رائعة! تحب تعرف أكتر؟', '💡 أقدر أساعدك تختار الأنسب.', '✨ كل منتجاتنا بجودة عالية.'] :
                    ['🌟 Great idea! Want to know more?', '💡 I can help you choose.', '✨ All our products are high quality.'];
                return replies[Math.floor(Math.random() * replies.length)];
            };

            const send = () => {
                if (!input.trim()) return;
                setMsgs(p => [...p, { from: 'user', text: input }]);
                const r = reply(input);
                setInput('');
                setTimeout(() => setMsgs(p => [...p, { from: 'bot', text: r }]), 500);
            };

            return (
                <>
                    <button onClick={() => setOpen(!open)} className="chat-brand-btn">
                        <i className="fas fa-comment-dots"></i>
                    </button>
                    {open && (
                        <div style={{position: 'fixed', bottom: '100px', right: '22px', zIndex: 999, width: '340px', maxWidth: '90vw'}} className="glass-card animate-fade-up">
                            <div style={{background: 'linear-gradient(135deg, #c49a7c, #7eb8c9)', padding: '14px 18px', borderRadius: '28px 28px 0 0', color: 'white', display: 'flex', justifyContent: 'space-between'}}>
                                <span style={{fontWeight: 'bold'}}>💬 MaWa Chat</span>
                                <button onClick={() => setOpen(false)} style={{background: 'none', border: 'none', color: 'white', fontSize: '18px', cursor: 'pointer'}}>✕</button>
                            </div>
                            <div ref={ref} style={{padding: '12px', maxHeight: '250px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '8px'}}>
                                {msgs.map((m, i) => (
                                    <div key={i} style={{padding: '10px 14px', borderRadius: '16px', maxWidth: '80%', alignSelf: m.from === 'bot' ? 'flex-start' : 'flex-end', background: m.from === 'bot' ? 'rgba(200,180,160,0.3)' : '#c49a7c', color: m.from === 'bot' ? 'inherit' : 'white', fontSize: '13px'}}>{m.text}</div>
                                ))}
                            </div>
                            <div style={{display: 'flex', gap: '8px', padding: '10px', borderTop: '1px solid rgba(0,0,0,0.1)'}}>
                                <input value={input} onChange={e => setInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && send()} placeholder={lang === 'ar' ? 'اكتب رسالتك...' : 'Type your message...'} style={{flex: 1, padding: '10px', borderRadius: '20px', fontSize: '13px'}} />
                                <button onClick={send} style={{width: '38px', height: '38px', borderRadius: '50%', background: '#c49a7c', border: 'none', color: 'white', fontSize: '16px', cursor: 'pointer'}}>➤</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // ========== مودال تفاصيل المنتج ==========
        const ProductModal = ({ product, onClose, lang }) => {
            if (!product) return null;
            return (
                <div style={{position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(6px)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center'}} onClick={onClose}>
                    <div className="glass-card animate-fade-up" style={{padding: '28px', width: '90%', maxWidth: '480px'}} onClick={e => e.stopPropagation()}>
                        <div style={{textAlign: 'center', fontSize: '60px', marginBottom: '12px'}}>{product.icon}</div>
                        <h3 style={{textAlign: 'center', fontSize: '20px', fontWeight: 'bold', marginBottom: '6px'}}>{lang === 'ar' ? product.name : product.nameEn}</h3>
                        <p style={{textAlign: 'center', opacity: 0.7, marginBottom: '12px'}}>{lang === 'ar' ? product.desc : product.descEn}</p>
                        <div style={{textAlign: 'center', fontSize: '28px', fontWeight: 'bold', color: '#c49a7c', marginBottom: '16px'}}>{product.price} <small style={{fontSize: '16px'}}>{lang === 'ar' ? 'جنيه' : 'EGP'}</small></div>
                        <button onClick={() => { window.open(`https://wa.me/201023872753?text=${encodeURIComponent(lang === 'ar' ? `أريد حجز: ${product.name}` : `I want to order: ${product.nameEn}`)}`, '_blank'); onClose(); }} className="btn-glow" style={{width: '100%', fontSize: '16px', padding: '14px'}}>
                            {lang === 'ar' ? '🛒 اطلب الآن عبر واتساب' : '🛒 Order via WhatsApp'}
                        </button>
                        <button onClick={onClose} style={{width: '100%', marginTop: '8px', padding: '10px', borderRadius: '14px', border: 'none', background: 'rgba(0,0,0,0.05)', cursor: 'pointer', fontWeight: '600'}}>{lang === 'ar' ? 'إغلاق' : 'Close'}</button>
                    </div>
                </div>
            );
        };

        // ========== بومودورو ==========
        const PomodoroTimer = ({ lang }) => {
            const sessions = [
                { name: lang === 'ar' ? 'تركيز قصير' : 'Short Focus', minutes: 15, icon: '☕', challenge: lang === 'ar' ? 'أنهِ مهمة واحدة صغيرة' : 'Finish one small task' },
                { name: lang === 'ar' ? 'تركيز متوسط' : 'Medium Focus', minutes: 25, icon: '🍅', challenge: lang === 'ar' ? 'أكمل 3 صفحات' : 'Complete 3 pages' },
                { name: lang === 'ar' ? 'تركيز عميق' : 'Deep Focus', minutes: 45, icon: '🔥', challenge: lang === 'ar' ? 'أنهِ مشروع كامل' : 'Finish a full project' },
                { name: lang === 'ar' ? 'جلسة إبداعية' : 'Creative Session', minutes: 60, icon: '💡', challenge: lang === 'ar' ? 'ابتكر شيئًا جديدًا' : 'Create something new' },
            ];
            const [session, setSession] = useState(1);
            const [time, setTime] = useState(sessions[1].minutes * 60);
            const [running, setRunning] = useState(false);
            const timerRef = useRef(null);

            useEffect(() => { setTime(sessions[session].minutes * 60); setRunning(false); }, [session]);
            useEffect(() => {
                if (running && time > 0) { timerRef.current = setInterval(() => setTime(t => t - 1), 1000); }
                else if (time === 0) { setRunning(false); alert(lang === 'ar' ? '🍅 انتهت الجلسة! استرح 5 دقائق.' : '🍅 Session done! Take 5 min break.'); }
                return () => clearInterval(timerRef.current);
            }, [running, time]);

            const mins = Math.floor(time / 60), secs = time % 60;
            const progress = ((sessions[session].minutes * 60 - time) / (sessions[session].minutes * 60)) * 360;

            return (
                <div className="glass-card animate-fade-up" style={{padding: '28px', textAlign: 'center', maxWidth: '500px', margin: '0 auto'}}>
                    <h3 style={{marginBottom: '14px'}}>{lang === 'ar' ? '🍅 مؤقت التركيز' : '🍅 Focus Timer'}</h3>
                    <div style={{display: 'flex', gap: '8px', justifyContent: 'center', flexWrap: 'wrap', marginBottom: '20px'}}>
                        {sessions.map((s, i) => (
                            <button key={i} onClick={() => setSession(i)} style={{
                                padding: '8px 16px', borderRadius: '14px', border: 'none', cursor: 'pointer',
                                fontWeight: i === session ? 'bold' : 'normal',
                                background: i === session ? '#c49a7c' : 'rgba(200,180,160,0.2)',

            const add = () => { if (!newTask.trim()) return; setTasks([{ id: Date.now(), text: newTask, done: false, priority: 'med' }, ...tasks]); setNewTask(''); };
            const toggle = (id) => setTasks(tasks.map(t => t.id === id ? {...t, done: !t.done} : t));
            const done = tasks.filter(t => t.done).length;
            const pct = tasks.length > 0 ? Math.round((done / tasks.length) * 100) : 0;

                <div className="glass-card animate-fade-up" style={{padding: '24px'}}>
